<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@raffylive</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-p1CmVbYkYQpQm3K6Yh9KqK8j1l1q0Q5c1NfZK1QZ6G1Yv1X0sZ1f1Q1X1V1Q1X1V1Q1X1V1Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div class="ps4-loader" id="loader">
    <div class="loader-content">
        <h1 class="load-title">LOADING</h1>
        <div class="glow-bar-load" id="loadBar"></div>
        <p class="load-text" id="loadText">raffylive</p>
    </div>
</div>

<!-- Audio assets (ensure these files exist in the repo) -->
<audio id="snd-startup" src="startup.mp3" preload="auto"></audio>
<audio id="snd-scroll" src="scroll.mp3" preload="auto"></audio>
<audio id="snd-select" src="select.mp3" preload="auto"></audio>

<div class="ps4-wave-bg" aria-hidden="true"></div>
<div class="dust-particles" id="dustContainer" aria-hidden="true"></div>

<div class="ps4-system">
<header class="profile-header">
    <div class="profile-card">
        <div class="avatar-box">
            <img src="profil.gif" alt="Profile GIF" class="avatar-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <i class="fa-solid fa-user fallback-user" style="display:none;"></i>
            <div class="online-indicator"></div>
        </div>
        <div class="profile-info">
            <h2 class="username">@raffy</h2>
            <span class="status-text">Online</span>
        </div>
    </div>
    <div class="time-display" id="clock" aria-live="polite">--:--</div>
</header>

<main class="main-dashboard">
    <button class="nav-arrow left-arrow" id="arrowLeftBtn" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="nav-arrow right-arrow" id="arrowRightBtn" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>

    <div class="carousel-window">
        <div class="carousel-track" id="track">
            <!-- Cleaned carousel tiles with safe placeholders (replace with real data if available) -->
            <a href="https://sociabuzz.com/raffyyy/support" class="ps-tile active" data-title="Donate & Support" data-desc="Support the creator. Every contribution keeps the project alive." data-img="cover-donate.png"></a>
            <a href="https://discord.gg/BB3cvSXyHh" class="ps-tile" data-title="Discord RaffyDistrik" data-desc="Join our primary text and voice channels. Chat with the global community." data-img="cover-discord.png"></a>
            <a href="https://discord.gg/RTuqegUFBK" class="ps-tile" data-title="Discord ERYTH" data-desc="Secondary community lounge for events and emergency updates." data-img="cover-discord2.png"></a>
            <a href="https://whatsapp.com/channel/0029Vakx3B9JENy8mhTdPs42" class="ps-tile" data-title="Saluran Whatsapp" data-desc="Direct message for fast-response business inquiries or personal messages." data-img="cover-wp.png"></a>
            <a href="http://instagram.com/raffybagas_" class="ps-tile" data-title="Instagram Account" data-desc="Check out my daily updates, behind-the-scenes photography, and stories." data-img="cover-ig.png"></a>
            <a href="https://youtube.com/@raffylive" class="ps-tile" data-title="YouTube Channel" data-desc="Watch high-quality video content, programming guides, and live streams." data-img="cover-yt.png"></a>
        </div>
    </div>
</main>

<section class="content-info">
    <h1 id="game-title">DONATE & SUPPORT</h1>
    <div class="action-btn-container">
        <button class="start-btn" id="startBtn">Start</button>
    </div>
    <p id="game-desc">Support the creator. Every contribution keeps the project alive.</p>
</section>

<footer class="footer-bar">
    <div class="hint pc-hint"><span class="key-icon yellow">Enter</span> Open</div>
    <div class="hint mobile-hint"><span class="key-icon">Swipe 🡠 🡢</span> Geser Menu</div>
</footer>

<script>
// DOM references
const track = document.getElementById('track');
const tiles = Array.from(document.querySelectorAll('.ps-tile'));
const gameTitle = document.getElementById('game-title');
const gameDesc = document.getElementById('game-desc');
const loader = document.getElementById('loader');
const loadText = document.getElementById('loadText');
const startBtn = document.getElementById('startBtn');
const sndStartup = document.getElementById('snd-startup');
const sndScroll = document.getElementById('snd-scroll');
const sndSelect = document.getElementById('snd-select');

let index = 0;
let isSystemReady = false;
let isLoadingFinished = false;

// Build tile inner structure safely
tiles.forEach(tile => {
    const imgUrl = tile.getAttribute('data-img') || 'cover-placeholder.png';
    const iconClass = tile.getAttribute('data-icon') || '';

    tile.innerHTML = `
        <div class="tile-art">
            <img src="${imgUrl}" alt="cover" class="cover-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <i class="fallback-icon" style="display:none;"></i>
        </div>`;

    const iconElement = tile.querySelector('.fallback-icon');
    if (iconClass === 'fa-heart') {
        iconElement.classList.add('fa-solid', 'fa-heart');
    } else if (iconClass) {
        iconElement.classList.add('fa-brands', iconClass);
    }
});

// Generate dust particles
const dustContainer = document.getElementById('dustContainer');
for (let i = 0; i < 15; i++) {
    const dust = document.createElement('div');
    dust.className = 'dust';
    const size = Math.floor(Math.random() * 5) + 3;
    dust.style.width = dust.style.height = `${size}px`;
    dust.style.left = `${Math.random() * 100}%`;
    dust.style.top = `${Math.random() * 50 + 50}%`;
    dust.style.animationDuration = `${Math.random() * 10 + 12}s`;
    dust.style.animationDelay = `${Math.random() * 6}s`;
    dustContainer.appendChild(dust);
}

function playSound(audio) {
    if (!audio) return;
    audio.currentTime = 0;
    audio.play().catch(() => {});
}

setTimeout(() => {
    const bar = document.getElementById('loadBar');
    if (bar) bar.style.display = 'none';
    loadText.textContent = 'PRESS ANY KEY OR CLICK TO START';
    loadText.classList.add('blink-text');
    isLoadingFinished = true;
}, 2200);

function startSystem() {
    if (!isLoadingFinished || isSystemReady) return;
    loader.classList.add('fade-out');
    isSystemReady = true;
    playSound(sndStartup);
    setTimeout(() => loader.remove(), 800);
}

document.addEventListener('click', startSystem, { passive: true });
document.addEventListener('touchstart', startSystem, { passive: true });

function updatePS4UI(targetIndex) {
    tiles.forEach((tile, i) => {
        const active = i === targetIndex;
        tile.classList.toggle('active', active);
        if (active) {
            gameTitle.textContent = (tile.getAttribute('data-title') || '').toUpperCase();
            gameDesc.textContent = tile.getAttribute('data-desc') || '';
        }
    });

    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
    const currentStep = isTouchDevice ? 135 : 165;
    const offset = -(targetIndex * currentStep);
    track.style.transform = `translate3d(${offset}px, 0, 0)`;

    if (isSystemReady) playSound(sndScroll);
}

function executeLinkAtIndex(idx) {
    playSound(sndSelect);
    setTimeout(() => {
        const tile = tiles[idx];
        if (tile && tile.href) window.open(tile.href, '_blank');
    }, 250);
}

startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isSystemReady) executeLinkAtIndex(index);
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    if (isLoadingFinished && !isSystemReady) { startSystem(); return; }
    if (!isSystemReady) return;

    if (e.key === 'ArrowRight' && index < tiles.length - 1) { e.preventDefault(); index++; updatePS4UI(index); }
    else if (e.key === 'ArrowLeft' && index > 0) { e.preventDefault(); index--; updatePS4UI(index); }
    else if (e.key === 'Enter') { e.preventDefault(); executeLinkAtIndex(index); }
});

// Touch swipe support
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
document.addEventListener('touchend', (e) => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });

function handleSwipe() {
    const swipeThreshold = 40;
    if (!isSystemReady) return;
    const swipeDistance = touchStartX - touchEndX;
    if (swipeDistance > swipeThreshold && index < tiles.length - 1) { index++; updatePS4UI(index); }
    else if (swipeDistance < -swipeThreshold && index > 0) { index--; updatePS4UI(index); }
}

// Update clock every second
setInterval(() => {
    const now = new Date();
    const timeString = now.toTimeString().substring(0,5);
    const clockEl = document.getElementById('clock');
    if (clockEl) clockEl.textContent = `${timeString} WIB`;
}, 1000);

// Arrow buttons
const arrowLeftBtn = document.getElementById('arrowLeftBtn');
const arrowRightBtn = document.getElementById('arrowRightBtn');
if (arrowLeftBtn) arrowLeftBtn.addEventListener('click', (e) => { e.stopPropagation(); if (isSystemReady && index > 0) { index--; updatePS4UI(index); } });
if (arrowRightBtn) arrowRightBtn.addEventListener('click', (e) => { e.stopPropagation(); if (isSystemReady && index < tiles.length - 1) { index++; updatePS4UI(index); } });

// Expose for debugging
window._ps4ui = { updatePS4UI, executeLinkAtIndex };
</script>
</body>
</html>
