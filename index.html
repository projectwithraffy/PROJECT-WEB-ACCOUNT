<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>@raffylive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
       <!-- --- GANTI BLOK LAYAR LOADING LAMA ANDA DENGAN STRUKTUR BERSIH INI --- -->
<div class="ps4-loader" id="loader">
    <div class="loader-content">
        <h1 class="load-title">LOADING</h1>
        <div class="glow-bar-load" id="loadBar"></div>
        <p class="load-text" id="loadText">raffylive</p> 
    </div>
</div>


    <!-- Papan Suara Konsole (Soundboard) -->
    <audio id="snd-startup" src="startup.mp3" preload="auto"></audio>
    <audio id="snd-scroll" src="scroll.mp3" preload="auto"></audio>
    <audio id="snd-select" src="select.mp3" preload="auto"></audio>

    <!-- Komponen Latar Belakang Ombak & Debu -->
    <div class="ps4-wave-bg"></div>
    <div class="dust-particles" id="dustContainer"></div>

    <div class="ps4-system">
        <!-- Header Kartu Identitas Pengguna -->
        <!-- --- CARI BAGIAN INI DI HTML ANDA DAN PASTIKAN SAMA BERSIHNYA --- -->
         
<header class="profile-header">
    <div class="profile-card">
        <div class="avatar-box">
            <img src="profil.gif" alt="Profile GIF" class="avatar-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <i class="fa-solid fa-user fallback-user" style="display:none;"></i>
            <div class="online-indicator"></div>
        </div>
        <div class="profile-info">
            <h2 class="username">@raffy</h2>
            <span class="status-text">Online</span>
        </div>
    </div>
    <div class="time-display" id="clock">--:--</div>
</header>

    <!-- Jalur Geser Kotak Sampul Sosmed (GANTI TAUTAN DAN NAMA FILE GAMBAR DI SINI) -->
       <main class="main-dashboard">
            <div class="carousel-window" id="carouselWindow">
                <div class="carousel-track" id="track">
                    <a href="https://sociabuzz.com/raffyyy/support" class="ps-tile active" data-title="Donate & Support" data-desc="Support the creator. Every contribution keeps the project alive." data-img="sociabuzz.png" data-icon="fa-heart"></a>
                    <a href="https://discord.gg/BB3cvSXyHh" class="ps-tile" data-title="Discord RaffyDistrik" data-desc="Join our primary text and voice channels. Chat with the global community." data-img="discord.png" data-icon="fa-discord"></a>
                    <a href="https://discord.gg/RTuqegUFBK" class="ps-tile" data-title="Discord ERYTH" data-desc="Secondary community lounge for events and emergency updates." data-img="discord.png" data-icon="fa-discord"></a>
                    <a href="https://whatsapp.com/channel/0029Vakx3B9JENy8mhTdPs42" class="ps-tile" data-title="Saluran Whatsapp" data-desc="Direct message for fast-response business inquiries or personal chat." data-img="whatsapp.jpg" data-icon="fa-whatsapp"></a>
                    <a href="http://instagram.com/raffybagas_" class="ps-tile" data-title="Instagram Account" data-desc="Check out my daily updates, behind-the-scenes photography, and stories." data-img="instagram.png" data-icon="fa-instagram"></a>
                    <a href="https://youtube.com/@raffylive" class="ps-tile" data-title="YouTube Channel" data-desc="Watch high-quality video content, programming guides, and live streams." data-img="youtube.png" data-icon="fa-youtube"></a>
                </div>
            </div>
            <!-- FIX: Wadah baru untuk kontrol navigasi di bawah carousel -->
            <div class="carousel-controls">
                <div class="custom-scrollbar-container">
                    <div class="custom-scrollbar-thumb" id="scrollbarThumb"></div>
                </div>
            </div>
        </main>

        <!-- Footer Informasi Aplikasi Aktif -->
        <section class="content-info">
            <h1 id="game-title">DONATE & SUPPORT</h1>
            <div class="action-btn-container">
                <button class="start-btn" id="startBtn">Start</button>
            </div>
            <p id="game-desc">Support the creator. Every contribution keeps the project alive.</p>
        </section>

        <!-- Navigasi Tombol Footer -->
    <footer class="footer-bar">
            <div class="footer-spacer"></div>
            <div class="footer-hints-container">
                <div class="hint pc-hint drag-hint"><span class="key-icon nav-icon"></span> Geser</div>
                <div class="hint pc-hint"><span class="key-icon yellow">Enter</span> Buka</div>
                <div class="hint mobile-hint"><span class="key-icon">Geser / Scroll</span></div>
                           <div class="hint mobile-hint"><span class="key-icon">Start</span></div>
            </div>
            <div class="credit-text">
                by <a href="https://instagram.com/kuruizero._" target="_blank" rel="noopener noreferrer">@kuruizero._</a>
            </div>
        </footer>

    <!-- Tautkan file JavaScript eksternal di sini -->
    <script src="script.js"></script>
</body>
</html>
